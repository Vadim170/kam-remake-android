plugins { id 'com.android.application' }

android {
    namespace 'org.kamremake.android'
    compileSdk 36
    ndkVersion '29.0.13599879'

    defaultConfig {
        applicationId 'org.kamremake.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-r16397'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cFlags '-Wall' } }
    }

    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packaging { jniLibs { useLegacyPackaging true } }

    // Optional: bundle the game data into the APK (-Pkam.bundleData=true), extracted on first launch.
    // build_apk.sh prepares build/bundle/kamdata with links to the KaM Remake data folders
    if (project.hasProperty('kam.bundleData') && project.property('kam.bundleData') == 'true') {
        sourceSets { main { assets.srcDirs += "${rootDir}/build/bundle" } }
    }
    androidResources {
        // Game files are already compressed, store them as is (faster extraction)
        noCompress 'rxx', 'rxa', 'avi', 'mp4', 'mp2', 'mp3', 'ogg', 'wav', 'libx', 'map', 'dat', 'script', 'txt', 'xml', 'json', 'png', 'fntx', 'fnt', 'cmp', 'pdf', 'ani', 'bbm', 'lbm', 'eng', 'rus', 'ger', 'pol', 'cze', 'fre', 'hun', 'ita', 'spa'
    }
}

dependencies {
    // Same video engine as the Windows version of KaM Remake (VLC), plays the original AVI intros
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'androidx.core:core:1.13.1'
}
